<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivacyProbe · Huella digital del navegador | Un fantasma en el sistema</title>
    <meta
      name="description"
      content="Mira qué datos expone tu navegador (canvas, WebGL, fuentes, pantalla, audio, WebRTC), cuánta información aportan según estudios reales y qué defensas funcionan. Todo se calcula en tu navegador."
    />
    <meta name="theme-color" content="#020617" />
    <meta property="og:title" content="PrivacyProbe · Huella digital del navegador" />
    <meta property="og:description" content="Tu huella digital, medida en tu navegador y comparada con estudios reales. Por Un fantasma en el sistema." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icono.png" />
    <link rel="icon" type="image/png" href="/icono.png" />
    <script>
      // Aplica idioma y tema guardados antes de pintar, para evitar un parpadeo.
      try {
        var th = localStorage.getItem('pp_theme');
        if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
        var lg = localStorage.getItem('pp_lang');
        if (lg === 'es' || lg === 'en') document.documentElement.lang = lg;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PrivacyProbe necesita JavaScript: mide lo que JavaScript puede leer de tu navegador. · PrivacyProbe needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
