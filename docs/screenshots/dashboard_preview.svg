<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas Frame -->
  <rect width="1100" height="620" rx="16" fill="url(#dbBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top App Navigation Bar -->
  <rect width="1100" height="64" rx="16 16 0 0" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="30" cy="32" r="6" fill="#f43f5e"/>
  <circle cx="50" cy="32" r="6" fill="#fbbf24"/>
  <circle cx="70" cy="32" r="6" fill="#10b981"/>

  <!-- Brand lockup -->
  <text x="105" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Un Fantasma en el Sistema</text>
  <text x="280" y="37" fill="#38bdf8" font-family="monospace" font-size="11">PrivacyProbe · Huella Digital</text>

  <!-- Top Links -->
  <g transform="translate(620, 36)" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
    <text x="0">Inspección Técnica</text>
    <text x="120">Mito de Incógnito</text>
    <text x="240">Entropía Shannon</text>
  </g>

  <!-- Action CTA -->
  <rect x="940" y="16" width="130" height="32" rx="6" fill="#0284c7"/>
  <text x="965" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Escanear Ahora</text>

  <!-- Hero Banner Strip -->
  <g transform="translate(40, 85)">
    <rect width="1020" height="150" rx="12" fill="#0b1329" stroke="#1e293b"/>
    
    <text x="30" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">SIMULADOR TÉCNICO DE FINGERPRINTING &amp; PRIVACIDAD</text>
    <text x="30" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">¿Qué tan único es tu navegador ante los rastreadores?</text>
    <text x="30" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Extracción sin cookies mediante Canvas 2D, WebGL, fuentes del sistema, Web Audio y APIs de hardware.</text>
    
    <!-- Composite Hash Badge -->
    <rect x="30" y="112" width="460" height="26" rx="4" fill="#020617" stroke="#1e293b"/>
    <text x="40" y="129" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Firma Criptográfica Compuesta:</text>
    <text x="210" y="129" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">7f4a9b1c-98e21a4f</text>

    <!-- KPI Box -->
    <rect x="780" y="20" width="210" height="110" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="800" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Entropía de Shannon</text>
    <text x="800" y="76" fill="#ffffff" font-family="monospace" font-size="26" font-weight="bold">35.8 <tspan font-size="13" fill="#64748b">bits</tspan></text>
    <text x="800" y="102" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">● 1 entre 58.000 millones (Único)</text>
  </g>

  <!-- Recharts & Technical Inspection Row -->
  <g transform="translate(40, 255)">
    <!-- Left: Recharts Simulation Chart Mockup -->
    <rect width="640" height="325" rx="12" fill="#0b1329" stroke="#1e293b"/>
    <text x="25" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Evolución de Entropía por Perfiles (Recharts Engine)</text>
    <text x="25" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Comparativa frente al umbral crítico de discriminación global (33 bits)</text>

    <!-- Grid lines -->
    <line x1="60" y1="90" x2="600" y2="90" stroke="#1e293b" stroke-dasharray="3 3"/>
    <line x1="60" y1="140" x2="600" y2="140" stroke="#1e293b" stroke-dasharray="3 3"/>
    <line x1="60" y1="190" x2="600" y2="190" stroke="#1e293b" stroke-dasharray="3 3"/>
    <line x1="60" y1="240" x2="600" y2="240" stroke="#1e293b"/>

    <!-- 33-bit Reference Line -->
    <line x1="60" y1="110" x2="600" y2="110" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="320" y="105" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Umbral de Unicidad Global (33 bits = 8.5B hab.)</text>

    <!-- Bars -->
    <!-- Chrome (35.8b) -->
    <rect x="90" y="94" width="45" height="146" rx="4" fill="url(#barRed)"/>
    <text x="112" y="86" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">35.8b</text>
    <text x="112" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Chrome</text>

    <!-- Incognito (35.5b) -->
    <rect x="180" y="97" width="45" height="143" rx="4" fill="#fb7185"/>
    <text x="202" y="89" fill="#fb7185" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">35.5b</text>
    <text x="202" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Incógnito</text>

    <!-- Brave (28.4b) -->
    <rect x="270" y="138" width="45" height="102" rx="4" fill="#fbbf24"/>
    <text x="292" y="130" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">28.4b</text>
    <text x="292" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Brave</text>

    <!-- Firefox RFP (21.6b) -->
    <rect x="360" y="178" width="45" height="62" rx="4" fill="#2dd4bf"/>
    <text x="382" y="170" fill="#2dd4bf" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">21.6b</text>
    <text x="382" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Firefox RFP</text>

    <!-- Tor Browser (10.4b) -->
    <rect x="450" y="208" width="45" height="32" rx="4" fill="url(#barGreen)"/>
    <text x="472" y="200" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">10.4b</text>
    <text x="472" y="260" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Tor Browser</text>

    <text x="25" y="300" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">✓ Incógnito no reduce la huella gráfica. Tor Browser logra anonimato masivo por homogeneidad.</text>
  </g>

  <!-- Right: Technical Inspection Cards -->
  <g transform="translate(700, 255)">
    <rect width="360" height="325" rx="12" fill="#0b1329" stroke="#1e293b"/>
    <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Vectores Técnicos Inspeccionados</text>

    <!-- Card: Canvas 2D -->
    <g transform="translate(20, 50)">
      <rect width="320" height="52" rx="6" fill="#020617" stroke="#1e293b"/>
      <text x="12" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Canvas 2D Fingerprint</text>
      <text x="12" y="38" fill="#38bdf8" font-family="monospace" font-size="10">Hash: 84a1e9c2 | 8.6 bits</text>
      <text x="240" y="28" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10">Crítico</text>
    </g>

    <!-- Card: WebGL GPU -->
    <g transform="translate(20, 112)">
      <rect width="320" height="52" rx="6" fill="#020617" stroke="#1e293b"/>
      <text x="12" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">WebGL GPU Vendor &amp; Renderer</text>
      <text x="12" y="38" fill="#34d399" font-family="monospace" font-size="10">NVIDIA / ANGLE Direct3D11</text>
      <text x="240" y="28" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10">7.8 bits</text>
    </g>

    <!-- Card: Fuentes -->
    <g transform="translate(20, 174)">
      <rect width="320" height="52" rx="6" fill="#020617" stroke="#1e293b"/>
      <text x="12" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Fuentes Instaladas en el SO</text>
      <text x="12" y="38" fill="#a78bfa" font-family="monospace" font-size="10">18 fuentes detectadas (Office/Design)</text>
      <text x="240" y="28" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">8.2 bits</text>
    </g>

    <!-- Card: WebRTC Leak -->
    <g transform="translate(20, 236)">
      <rect width="320" height="65" rx="6" fill="#020617" stroke="#1e293b"/>
      <text x="12" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">WebRTC &amp; STUN ICE Leak Test</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Auditoría de fuga de IPs locales / bypass VPN</text>
      <text x="12" y="52" fill="#38bdf8" font-family="monospace" font-size="10">mDNS Anonymization Activa</text>
    </g>
  </g>
</svg>
