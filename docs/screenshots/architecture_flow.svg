<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title Bar -->
  <text x="40" y="48" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">Arquitectura de Inspección y Mitigación de Huella Digital</text>
  <text x="40" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">PrivacyProbe · Un Fantasma en el Sistema (unfantasmaenelsistema.com)</text>

  <!-- Column 1: Vectores Técnicos Expuestos -->
  <g transform="translate(40, 105)">
    <rect width="270" height="275" rx="12" fill="#0b1329" stroke="#1e293b"/>
    <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1. VECTORES DE CLIENTE (JS)</text>
    <line x1="20" y1="44" x2="250" y2="44" stroke="#1e293b"/>
    
    <g transform="translate(20, 62)" font-family="monospace" font-size="11" fill="#cbd5e1">
      <text y="0">● Canvas 2D (Sub-pixel rendering)</text>
      <text y="28">● WebGL GPU (Vendor &amp; Renderer)</text>
      <text y="56">● AudioContext (DynamicsCompressor)</text>
      <text y="84">● Fuentes Locales (Metrics Probe)</text>
      <text y="112">● Pantalla &amp; HiDPI (Screen rect)</text>
      <text y="140">● Hardware Concurrency (Cores/RAM)</text>
      <text y="168">● WebRTC ICE (Candidatos STUN)</text>
      <text y="196">● Locale &amp; Timezone (UTC Offset)</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -->
  <path d="M 320 240 L 360 240" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Column 2: Motor de Entropía & Cruce -->
  <g transform="translate(365, 105)">
    <rect width="270" height="275" rx="12" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">2. ENTROPÍA DE SHANNON</text>
    <line x1="20" y1="44" x2="250" y2="44" stroke="#1e293b"/>

    <g transform="translate(20, 70)" font-family="system-ui, sans-serif" font-size="12">
      <rect width="230" height="42" rx="6" fill="#1e1b4b" stroke="#3730a3"/>
      <text x="12" y="26" fill="#a5b4fc" font-family="monospace" font-size="12">H(X) = - ∑ P(x) · log₂ P(x)</text>

      <g transform="translate(0, 56)">
        <text y="16" fill="#94a3b8" font-size="11">Total Entropía Convencional:</text>
        <text y="38" fill="#f43f5e" font-family="monospace" font-size="18" font-weight="bold">~35.8 bits</text>
        <text y="58" fill="#fb7185" font-size="11">1 en 58.000 millones (Único)</text>
      </g>

      <g transform="translate(0, 138)">
        <rect width="230" height="34" rx="6" fill="#1c1917" stroke="#78350f"/>
        <text x="10" y="21" fill="#fde68a" font-size="10 font-bold">Modo Incógnito: 0 bits reducidos</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrow 2 -->
  <path d="M 645 240 L 685 240" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Column 3: Defensas & Mitigaciones -->
  <g transform="translate(690, 105)">
    <rect width="270" height="275" rx="12" fill="#0b1329" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3. ESTRATEGIAS DE DEFENSA</text>
    <line x1="20" y1="44" x2="250" y2="44" stroke="#1e293b"/>

    <g transform="translate(20, 60)" font-family="system-ui, sans-serif">
      <!-- Brave Farbling -->
      <rect width="230" height="85" rx="8" fill="#18181b" stroke="#3f3f46"/>
      <text x="10" y="20" fill="#fbbf24" font-size="11" font-weight="bold">A. RUIDO (Brave Farbling)</text>
      <text x="10" y="38" fill="#a1a1aa" font-size="10">Perturbación estocástica ±1 en subpíxel.</text>
      <text x="10" y="54" fill="#a1a1aa" font-size="10">El hash cambia en cada sesión.</text>
      <text x="10" y="72" fill="#fef08a" font-family="monospace" font-size="10 font-bold">Entropía: ~28.4 bits</text>

      <!-- Tor Homogeneity -->
      <g transform="translate(0, 96)">
        <rect width="230" height="96" rx="8" fill="#064e3b" stroke="#059669"/>
        <text x="10" y="20" fill="#a7f3d0" font-size="11" font-weight="bold">B. HOMOGENEIDAD (Tor / Mullvad)</text>
        <text x="10" y="38" fill="#6ee7b7" font-size="10">Letterboxing + 4 fuentes estándar +</text>
        <text x="10" y="52" fill="#6ee7b7" font-size="10">GPU genérica + UTC + UA congelado.</text>
        <text x="10" y="70" fill="#ffffff" font-size="10 font-bold">"Ocultarse en la multitud"</text>
        <text x="10" y="86" fill="#a7f3d0" font-family="monospace" font-size="10 font-bold">Entropía: ~10.4 bits (1 en 1.350)</text>
      </g>
    </g>
  </g>
</svg>
