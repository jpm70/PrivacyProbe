name: Pruebas y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias (lockfile exacto)
        run: bun install --frozen-lockfile
      - name: Tipos
        run: bun run lint
      - name: Pruebas
        run: bun run test
      - name: Compilar para GitHub Pages
        run: bun run build
        env:
          GITHUB_PAGES: 'true'
      - name: Comprobar que no se cargan recursos de terceros
        run: |
          ! grep -RIl "fonts.googleapis\|fonts.gstatic" dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ./dist

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
